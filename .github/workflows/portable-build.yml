name: Build Portable

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag'
        required: true
        default: 'v1.0.0'
      create_release:
        description: 'Create Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  SINGBOX_VER: '1.14.3'
  XRAY_VER: '26.3.27'
  MIHOMO_VER: '1.19.32'
  FLUTTER_VERSION: '3.24.5'

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pystray pillow
      - name: Download cores and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/core/bin | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VER }}/sing-box-${{ env.SINGBOX_VER }}-windows-amd64.zip" -OutFile sb.zip
          Expand-Archive sb.zip sb_out -Force
          $sb = Get-ChildItem -Recurse sb_out -Filter sing-box.exe | Select-Object -First 1
          if (-not $sb) { throw "sing-box.exe not found" }
          Copy-Item $sb.FullName desktop/core/bin/sing-box.exe -Force
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v${{ env.XRAY_VER }}/Xray-windows-64.zip" -OutFile xr.zip
          Expand-Archive xr.zip xr_out -Force
          $xr = Get-ChildItem -Recurse xr_out -Filter xray.exe | Select-Object -First 1
          if (-not $xr) { throw "xray.exe not found" }
          Copy-Item $xr.FullName desktop/core/bin/xray.exe -Force
          $mhVer = "${{ env.MIHOMO_VER }}"
          $mhUrls = @(
            "https://github.com/MetaCubeX/mihomo/releases/download/v$mhVer/mihomo-windows-amd64-compatible-v$mhVer.zip",
            "https://github.com/MetaCubeX/mihomo/releases/download/v$mhVer/mihomo-windows-amd64-v$mhVer.zip"
          )
          $mhOk = $false
          foreach ($u in $mhUrls) {
            try {
              Write-Host "Downloading $u"
              Invoke-WebRequest -Uri $u -OutFile mh.zip
              $mhOk = $true
              break
            } catch { Write-Host "fail $u : $_" }
          }
          if (-not $mhOk) { throw "mihomo download failed" }
          Expand-Archive mh.zip mh_out -Force
          $mh = Get-ChildItem -Recurse mh_out -File | Where-Object { $_.Name -like "mihomo*" -and $_.Extension -eq ".exe" } | Select-Object -First 1
          if (-not $mh) { throw "mihomo.exe not found in archive" }
          Copy-Item $mh.FullName desktop/core/bin/mihomo.exe -Force

          # 预置 GeoFiles 到 core/bin
          Invoke-WebRequest -Uri "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat" -OutFile desktop/core/bin/geoip.dat -TimeoutSec 90
          try {
            Invoke-WebRequest -Uri "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat" -OutFile desktop/core/bin/geosite.dat -TimeoutSec 90
          } catch {
            Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile desktop/core/bin/geosite.dat -TimeoutSec 90
          }


          Set-Location desktop

          # 将本次发版 tag 写入 APP_VERSION，与 Release / 徽章一致
          $tag = "${{ github.event.inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "1.0.0" }
          $ver = $tag -replace '^v',''
          $gui = "netbridge_gui.py"
          if (Test-Path $gui) {
            (Get-Content $gui -Raw) -replace 'APP_VERSION\s*=\s*"[^"]*"', ("APP_VERSION = `"$ver`"") | Set-Content $gui -NoNewline
            Write-Host "APP_VERSION set to $ver"
          }
          pyinstaller --noconfirm --clean --windowed --name NetBridge --icon netbridge.ico --onedir --hidden-import pystray --hidden-import PIL --hidden-import PIL.Image --hidden-import pystray._native_windows netbridge_gui.py
          if (-not (Test-Path dist/NetBridge/NetBridge.exe)) { throw "PyInstaller output missing" }
          # 核心目录对齐 v2rayN：core/bin 下放 xray、sing-box、geo
          New-Item -ItemType Directory -Force -Path dist/NetBridge/core/bin | Out-Null
          Copy-Item core/bin/* dist/NetBridge/core/bin/ -Force
          # 统一 Windows 可执行后缀，避免「mihomo 未安装」
          Get-ChildItem dist/NetBridge/core/bin -File | ForEach-Object {
            $n = $_.Name.ToLower()
            if ($n -eq "xray") { Rename-Item $_.FullName "xray.exe" -Force }
            if ($n -eq "mihomo") { Rename-Item $_.FullName "mihomo.exe" -Force }
            if ($n -eq "sing-box") { Rename-Item $_.FullName "sing-box.exe" -Force }
            if ($n -eq "clash") { Rename-Item $_.FullName "mihomo.exe" -Force }
          }
          $must = @("xray.exe","sing-box.exe","mihomo.exe","geoip.dat","geosite.dat")
          foreach ($m in $must) {
            if (-not (Test-Path "dist/NetBridge/core/bin/$m")) { throw "missing $m in core/bin" }
          }
          Get-ChildItem dist/NetBridge/core/bin | Format-Table Name, Length
          if (Test-Path dist/NetBridge/README.txt) { Remove-Item dist/NetBridge/README.txt -Force }
          if (Test-Path dist/NetBridge/README.md) { Remove-Item dist/NetBridge/README.md -Force }


          # GeoFiles 必须内置
          $geoOk = $false
          foreach ($pair in @(
            @{u="https://github.com/v2fly/geoip/releases/latest/download/geoip.dat"; o="geoip.dat"},
            @{u="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"; o="geoip.dat"}
          )) {
            try {
              Invoke-WebRequest -Uri $pair.u -OutFile "dist/NetBridge/core/bin/$($pair.o)" -TimeoutSec 90
              if ((Get-Item "dist/NetBridge/core/bin/$($pair.o)").Length -gt 10000) { $geoOk = $true; break }
            } catch { Write-Host "geoip try fail: $_" }
          }
          if (-not $geoOk) { throw "geoip.dat download failed" }
          $siteOk = $false
          foreach ($u in @(
            "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat",
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
          )) {
            try {
              Invoke-WebRequest -Uri $u -OutFile dist/NetBridge/core/bin/geosite.dat -TimeoutSec 90
              if ((Get-Item dist/NetBridge/core/bin/geosite.dat).Length -gt 10000) { $siteOk = $true; break }
            } catch { Write-Host "geosite try fail: $_" }
          }
          if (-not $siteOk) { throw "geosite.dat download failed" }
          Get-ChildItem dist/NetBridge/core/bin | Format-Table Name, Length
          if (Test-Path dist/NetBridge/README.txt) { Remove-Item dist/NetBridge/README.txt -Force }
          if (Test-Path dist/NetBridge/README.md) { Remove-Item dist/NetBridge/README.md -Force }

          # 资源进 assets，避免解压根目录一堆同图标
          New-Item -ItemType Directory -Force -Path dist/NetBridge/assets | Out-Null
          foreach ($f in @("netbridge.ico","netbridge.png","netbridge_tray.png","bg_gradient.png")) {
            if (Test-Path $f) { Copy-Item $f "dist/NetBridge/assets/$f" -Force }
          }
          if (Test-Path "assets") {
            Copy-Item "assets\*" "dist/NetBridge/assets\" -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Filter "icon_*.png" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "dist/NetBridge/assets/" -Force }
          Get-ChildItem -Filter "icon_*.ico" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "dist/NetBridge/assets/" -Force }
          # 根目录说明：双击 NetBridge.exe
          $readme = @(
            "NetBridge Windows Portable"
            "Run NetBridge.exe in this folder."
            "core\bin = xray / sing-box / geo"
            "assets = icons"
            "_internal = runtime libs (do not delete)"
            "Default port: 7890"
          ) -join "`r`n"
          # README removed
          Compress-Archive -Path dist/NetBridge/* -DestinationPath ../NetBridge-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: NetBridge-windows-x64.zip

  linux-desktop:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev unzip curl
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Build Linux
        run: |
          set -e
          mkdir -p core_bundle/bin
          curl -fL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
          tar -xzf sb.tgz
          find . -name sing-box -type f ! -path './core_bundle/*' | head -1 | xargs -I{} cp {} core_bundle/bin/sing-box
          curl -fL -o xr.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VER}/Xray-linux-64.zip"
          unzip -qo xr.zip -d xr_out
          find xr_out -name xray -type f | head -1 | xargs -I{} cp {} core_bundle/bin/xray
          chmod +x core_bundle/bin/*
          flutter create build_app --project-name netbridge --platforms=linux --org com.netbridge
          rm -rf build_app/lib && mkdir -p build_app/lib
          cp flutter/lib/*.dart build_app/lib/
          cp flutter/pubspec.yaml build_app/pubspec.yaml
          (cd build_app && flutter pub get && flutter build linux --release)
          SRC=$(find build_app/build/linux -type d -path '*/release/bundle' | head -1)
          test -n "$SRC"
          cp -a core_bundle "$SRC/core"
          tar -czvf NetBridge-linux-x64.tar.gz -C "$SRC" .
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-x64
          path: NetBridge-linux-x64.tar.gz

  macos-desktop:
    # 与其它 job 并行；macos-14 队列有时比 macos-latest 更短
    runs-on: macos-14
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - name: Build macOS
        run: |
          set -e
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            SB="sing-box-${SINGBOX_VER}-darwin-arm64.tar.gz"
            XR="Xray-macos-arm64-v8a.zip"
          else
            SB="sing-box-${SINGBOX_VER}-darwin-amd64.tar.gz"
            XR="Xray-macos-64.zip"
          fi
          mkdir -p core_bundle/bin
          curl -fL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/$SB"
          tar -xzf sb.tgz
          find . -name sing-box -type f ! -path './core_bundle/*' | head -1 | xargs -I{} cp {} core_bundle/bin/sing-box
          curl -fL -o xr.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VER}/$XR"
          unzip -qo xr.zip -d xr_out
          find xr_out -name xray -type f | head -1 | xargs -I{} cp {} core_bundle/bin/xray
          chmod +x core_bundle/bin/*

          flutter create build_app --project-name netbridge --platforms=macos --org com.netbridge
          rm -rf build_app/lib && mkdir -p build_app/lib
          cp flutter/lib/*.dart build_app/lib/
          cp flutter/pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/macos/Runner
          cp macos_native/VpnPlugin.swift build_app/macos/Runner/VpnPlugin.swift || true

          (cd build_app && flutter pub get && flutter build macos --release)

          # 使用绝对路径，避免 cd 后相对路径失效
          APP=$(find "$PWD/build_app/build/macos" -name "*.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          test -d "$APP"

          mkdir -p "$APP/Contents/Resources/core/bin"
          cp core_bundle/bin/* "$APP/Contents/Resources/core/bin/"

          rm -rf macos_out
          mkdir -p macos_out
          cp -a "$APP" macos_out/
          cp -a core_bundle macos_out/core
          (cd macos_out && zip -r ../NetBridge-macos.zip .)
          ls -lh NetBridge-macos.zip

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos
          path: NetBridge-macos.zip

  android-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        run: |
          set -e
          flutter create build_app --project-name netbridge --platforms=android --org com.netbridge
          rm -rf build_app/lib && mkdir -p build_app/lib
          cp flutter/lib/*.dart build_app/lib/
          cp flutter/pubspec.yaml build_app/pubspec.yaml

          mkdir -p build_app/android/app/src/main/assets/core
          set +e
          curl -fL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-android-arm64.tar.gz" \
            || curl -fL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-arm64.tar.gz"
          if [ -f sb.tgz ]; then
            tar -xzf sb.tgz
            find . -name sing-box -type f ! -path './build_app/*' | head -1 | xargs -I{} cp {} build_app/android/app/src/main/assets/core/sing-box
          fi
          curl -fL -o xr.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VER}/Xray-android-arm64-v8a.zip" \
            || curl -fL -o xr.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VER}/Xray-linux-arm64-v8a.zip"
          if [ -f xr.zip ]; then
            unzip -qo xr.zip -d xr_out
            find xr_out -name xray -type f | head -1 | xargs -I{} cp {} build_app/android/app/src/main/assets/core/xray
          fi
          chmod +x build_app/android/app/src/main/assets/core/* 2>/dev/null || true
          set -e

          PKG=build_app/android/app/src/main/kotlin/com/netbridge/netbridge
          mkdir -p "$PKG"
          cp android_native/MainActivity.kt "$PKG/"
          cp android_native/VpnPlugin.kt "$PKG/"
          cp android_native/NetBridgeVpnService.kt "$PKG/"

          find build_app/android \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) | while read -r f; do
            case "$f" in
              */com/netbridge/netbridge/MainActivity.kt) ;;
              *) rm -f "$f" ;;
            esac
          done

          MANIFEST=build_app/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<application/{s|<application|    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|}' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST"
          fi
          if ! grep -q 'NetBridgeVpnService' "$MANIFEST"; then
            sed -i 's|</application>|        <service android:name=".NetBridgeVpnService" android:exported="false" android:permission="android.permission.BIND_VPN_SERVICE"><intent-filter><action android:name="android.net.VpnService"/></intent-filter></service>\n    </application>|' "$MANIFEST"
          fi

          (cd build_app && flutter pub get && flutter build apk --release)
          cp build_app/build/app/outputs/flutter-apk/app-release.apk NetBridge-android.apk
          ls -lh NetBridge-android.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: NetBridge-android.apk

  ios-unsigned:
    runs-on: macos-14
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build iOS
        run: |
          set -e
          flutter create build_app --project-name netbridge --platforms=ios --org com.netbridge
          rm -rf build_app/lib && mkdir -p build_app/lib
          cp flutter/lib/*.dart build_app/lib/
          cp flutter/pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/ios/Runner build_app/ios/Tunnel
          cp ios_native/AppVpnPlugin.swift build_app/ios/Runner/ || true
          cp ios_native/PacketTunnelProvider.swift build_app/ios/Tunnel/ || true
          echo "iOS unsigned: sign with Xcode before install." > IOS_VPN_README.txt
          (cd build_app && flutter pub get && flutter build ios --release --no-codesign)
          APP=$(find "$PWD/build_app/build/ios" -name "*.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -a "$APP" Payload/
          zip -r NetBridge-ios.ipa Payload
          zip -j NetBridge-ios.zip NetBridge-ios.ipa IOS_VPN_README.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios
          path: NetBridge-ios.zip

  # 五个平台并行构建完成后统一发版（任一非 Windows 失败不阻断，见 continue-on-error）
  release:
    needs:
      - windows-portable
      - linux-desktop
      - macos-desktop
      - android-apk
      - ios-unsigned
    runs-on: ubuntu-latest
    if: ${{ always() && github.event.inputs.create_release == 'true' && needs.windows-portable.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Flatten artifacts
        run: |
          mkdir -p release_files
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp -f "$f" "release_files/$(basename "$f")"
          done
          ls -la release_files || true

      - name: Delete old assets on same tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag_name }}
        run: |
          set +e
          # 若该 tag 已有 Release，删除其全部旧附件（避免 portable / unsigned 等残留）
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" --jq '.id' 2>/dev/null)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "Found existing release id=$RELEASE_ID for tag $TAG"
            ASSETS=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" --jq '.[].id' 2>/dev/null)
            for id in $ASSETS; do
              echo "Deleting asset id=$id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${id}" || true
            done
          else
            echo "No existing release for tag $TAG (will create new)"
          fi
          set -e

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: NetBridge ${{ github.event.inputs.tag_name }}
          body: |
            ## NetBridge ${{ github.event.inputs.tag_name }}

            | Platform | File |
            |----------|------|
            | Windows | NetBridge-windows-x64.zip |
            | Linux | NetBridge-linux-x64.tar.gz |
            | macOS | NetBridge-macos.zip |
            | Android | NetBridge-android.apk |
            | iOS | NetBridge-ios.zip |
          files: release_files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
